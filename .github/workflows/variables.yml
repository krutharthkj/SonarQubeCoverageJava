---
name: variables in java workflow
on:
 workflow_dispatch:
 push:
   branches:
      - master
 pull_request:
    branches:
      - master
       
env:
 java_version: 17
 
jobs:
 job1:
  runs-on: ubuntu-latest
  steps:
  
  - name: clone the repo
    uses: actions/checkout@v6
  
  - name: install java
    uses: actions/setup-java@v5
    with:
     distribution: 'temurin'
     java-version: ${{ env.java_version }}
   
  - name: build java code
    run: mvn clean package 
