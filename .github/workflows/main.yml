name: build java application
on: 
 workflow_dispatch:
 push:
   branches:
     - master
 pull_request:
   branches:
     - master   
     
jobs:
 job1:
  runs-on: ubuntu-latest
  steps:
  - name: checkout the code
    uses: actions/checkout@v6
  
  - name: install java
    uses: actions/setup-java@v5
    with:
      distribution: 'termurin'
      java-version: '17'
      
  - name: build the code
    run: mvn clean package
